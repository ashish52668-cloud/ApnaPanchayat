<html>
	<head>
		<title>Login page</title>
		<style>
			#mainarea {
					width:100%;
					height:1000px;
					background:red;
					position:relative;
			}
			#formarea {
					width:35%;
					height:500px;
					position:relative;
					top:200px;
					border-radius:10px;
					background:cyan;
					left:20%;
			}
			#formarea h2 {
					text-align:center;
					font-weight:700;
					position:relative;
					font-size:32px;
					
			}
			#formarea form {
					position:relative;
					left:20px;
			}
			#formarea form label {
						font-size:23px;
						font-weight:400;
						position:relative;
						top:5px;
						
			}
			#formarea form input {
						width:360px;
						height:40px;
						border-radius:4px;
						top:5px;
						margin-bottom:20px;
			}
			#formarea form input[type="email"]{
								position:relative;
								left:30px;
			}
			#formarea form button {
							width:120px;
							height:35px;
							position:relative;
							top:30px;
							background:#FDCFAA;
							border:none;
							border-radius:5px;
							font-size:18px;
							
			}	
			#formarea p {
					text-decoration:none;
					font-size:20px;
					position:relative;
					top:30px;
			}
			#formarea p a {
					text-decoration:none;
			}
			#formarea p a:hover {
						color:red;
			}	
		</style>
	</head>
	<body>
		<div id="mainarea">
			<div id="formarea">
				<h2>Register</h2>
				<form>	
					<label>Name:</label>
					<input type="text" name="name" placeholder="Enter Your Name"><br><br>

					<label>Phone:</label>
					<input type="number" name="number" placeholder="Enter valid phoneno."><br><br>

					<label>Email:</label>
					<input type="email" name="email" placeholder="Enter valid email"><br><br>
					<label>Password:</label>
					<input type="password" name="password" placeholder="Enter strong password"><br>
					<button>Register</button>
					<p>If already registered? 
						<a href="login.html">Login</a></p>
					

			</div>
		</div>
	</body>
</html>
