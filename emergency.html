<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="emerg.css">
</head>
<body>
    <header class="toparea"> 
        <h2><i class="fa-solid fa-triangle-exclamation"></i>  Emergeny Contacts</h2>
        <h3>Quick Help ->24*7</h3>
    </header>
    <section class="mainarea">
        <div class="container">
            <div class="row g-3">
                <div class="col-lg-6">
                    <div class="box">
                    <div class="card text-end">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fa-solid fa-shield-halved"></i>  Police</h5>
                            <p class="card-text">Emergency Assistance</p>
                            <button>CALL 112</button>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="box">
                    <div class="card text-end">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fa-solid fa-truck-medical"></i>Ambulance </h5>
                            <p class="card-text">Medical Emergency</p>
                            <button>CALL 102</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-lg-6">
                    <div class="box">
                    <div class="card text-end">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fa-solid fa-fire-extinguisher"></i>Fire & Rescue </h5>
                            <p class="card-text">Fire Emergency</p>
                            <button>CALL 101</button>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="box">
                    <div class="card text-end">
                        <div class="card-body">
                            <h5 class="card-title"><i class="fa-solid fa-child-reaching"></i>Child Helpline</h5>
                            <p class="card-text">Child Emergency/Support</p>
                            <button>CALL 1098</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            
        </div>
    </section>
    <section>
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="box1">
                        <div class="card text-end">
                            <div class="card-body">
                                <h5 class="card-title"><i class="fa-solid fa-triangle-exclamation"></i>For Immediate Emergency</h5>
                                <p class="card-text">Instant Emergency Helping</p>
                                <button>CALL 112</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <div class="btan">
                        <button>View All Emergency Help =></button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
